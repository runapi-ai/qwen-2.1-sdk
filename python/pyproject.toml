[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runapi-qwen-2-1"
version = "0.1.0"
description = "RunAPI Qwen 2.1 SDK for text-to-image, transparent-background, and mask-based image editing workflows in JavaScript, Python, Ruby, Go, Java, and PHP"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "RunAPI", email = "contact@runapi.ai" }]
keywords = ["runapi", "runapi-ai", "qwen-2-1", "api", "sdk", "typescript", "python", "ruby", "golang", "java", "maven", "gradle", "image-generation", "text-to-image", "edit-image", "image-api", "qwen-2-1-image-api"]
dependencies = ["runapi-core~=0.10.1"]

[project.urls]
Homepage = "https://runapi.ai/models/qwen-2.1"
Documentation = "https://runapi.ai/docs/resources/sdks"
Source = "https://github.com/runapi-ai/qwen-2.1-sdk"
Issues = "https://github.com/runapi-ai/qwen-2.1-sdk/issues"
Changelog = "https://github.com/runapi-ai/qwen-2.1-sdk/blob/main/CHANGELOG.md"
"Release Notes" = "https://github.com/runapi-ai/qwen-2.1-sdk/releases/tag/python%2Fv0.1.0"

[tool.hatch.build.targets.wheel]
packages = ["src/runapi"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8"]

[tool.runapi]
slug = "qwen-2.1"
